version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nodeloc-faka-backend
    restart: unless-stopped
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - NODELOC_CLIENT_ID=${NODELOC_CLIENT_ID}
      - NODELOC_CLIENT_SECRET=${NODELOC_CLIENT_SECRET}
      - NODELOC_REDIRECT_URI=${NODELOC_REDIRECT_URI}
      - SESSION_SECRET=${SESSION_SECRET}
      - PAYMENT_ID=${PAYMENT_ID}
      - PAYMENT_SECRET=${PAYMENT_SECRET}
      - PAYMENT_CALLBACK_URI=${PAYMENT_CALLBACK_URI}
      - SERVER_PORT=8080
    volumes:
      - uploads_data:/app/uploads
    networks:
      - faka-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  
  # Frontend - Nuxt 4 + MarketPro template
  frontend:
    build:
      context: ./marketpro
      dockerfile: Dockerfile
    container_name: nodeloc-faka-frontend
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:8080
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - faka-network

networks:
  faka-network:
    driver: bridge

volumes:
  uploads_data:
