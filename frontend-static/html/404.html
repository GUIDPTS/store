<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 页面不存在</title>
  <link rel="stylesheet" href="/marketpro/css/app.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-utilities.min.css">
  <!-- Phosphor Icons (icon font for ph/ph-fill classes) -->
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <!-- Tailwind JIT CDN: provides utilities not included in purged app.min.css -->
  <script>
    window.tailwind = { config: {
      corePlugins: { preflight: false },
      theme: { extend: {
        colors: {
          main: { DEFAULT:'#299e60', 50:'#e7f9ef', 100:'#cef2df', 200:'#b6eccf', 300:'#9ee6bf', 400:'#85e0af', 500:'#6dd9a0', 600:'#299e60', 700:'#258e56', 800:'#207e4c', 900:'#1c6d42' },
          danger: { 50:'#FEF2F2', 100:'#FEE2E2', 200:'#FECACA', 300:'#FCA5A5', 400:'#F87171', 500:'#EF4444', 600:'#DC2626', 700:'#B91C1C', 800:'#991B1B' },
          warning: { 50:'#FEFCE8', 100:'#FEF9C3', 200:'#FEF08A', 300:'#FDE047', 400:'#FACC15', 500:'#EAB308', 600:'#FF9F29', 700:'#f39016' },
          success: { 50:'#F0FDF4', 100:'#DCFCE7', 200:'#BBF7D0', 600:'#27AE60', 700:'#15803D' },
          'color-one':'#F3FAF2', 'color-two':'#FFFBF4', 'color-three':'#F1F1F1',
        }
      }}
    }};
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
    <link rel="shortcut icon" href="/marketpro/images/logo/favicon.png">
    <link rel="stylesheet" href="/marketpro/css/slick.css">
    <link rel="stylesheet" href="/marketpro/css/animate.css">
    <style>
    .progress-wrap { position: fixed; right: 1.5rem; bottom: 1.5rem; width: 46px; height: 46px; cursor: pointer; border-radius: 50px; box-shadow: inset 0 0 0 2px rgba(130,130,130,0.2); z-index: 10000; opacity: 0; visibility: hidden; transform: translateY(12px); transition: all 200ms linear; }
      [x-cloak]{display:none !important;}
      .nav-menu__link{font-size:14px !important;font-weight:500;color:#333;padding:12px 16px;line-height:1.4;white-space:nowrap;}
      .nav-menu__link:hover{color:#299e60;}
      .nav-menu{list-style:none;padding:0;margin:0;}
      .nav-menu__item{position:relative;}
      .nav-menu__item.activePage > .nav-menu__link{color:#299e60;}
      .header-inner{min-height:64px;}
      @media (min-width: 992px){.mobile-menu{display:none !important;}.toggle-mobileMenu{display:none !important;}}
      .header-middle{padding:18px 0;}
      .common-input:focus { box-shadow: none !important; outline: none !important; font-weight: 400 !important; }
      .header { box-shadow: 0 4px 20px rgba(0,0,0,.08) !important; }
      .on-hover-dropdown { transition: opacity .2s ease, visibility .2s ease, margin-top .2s ease !important; }
      .header .category-big-dropdown { min-width: 480px; }
      .header{padding:8px 0;}
      .py-120{padding-top:64px;padding-bottom:48px;}
      .footer h6, .footer-item__title {
        font-family: Quicksand, sans-serif !important;
        font-size: 1.125rem !important;
        font-weight: 700 !important;
        color: #121535 !important;
        margin-bottom: 20px !important;
        line-height: 1.3 !important;
      }
      .footer-menu { list-style: none; padding: 0; margin: 0; }
      [data-aos] { opacity: 1 !important; transform: none !important; }
      .preloader{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;align-items:center;justify-content:center;}
      .progress-wrap{position:fixed;right:24px;bottom:24px;width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.12);cursor:pointer;opacity:0;visibility:hidden;transform:translateY(20px);transition:all .2s ease;z-index:90;}
      .progress-wrap.active-progress{opacity:1 !important;visibility:visible !important;transform:translateY(0) !important;}
      .progress-wrap svg{display:block;width:100%;height:100%;}
      .search-box{position:fixed;inset:0;background:rgba(18,21,53,.92);display:none;align-items:center;justify-content:center;z-index:9000;}
      .search-box.active{display:flex;}
      .overlay{position:fixed;inset:0;background:rgba(18,21,53,.6);opacity:0;visibility:hidden;transition:.2s;z-index:80;}
      .overlay.show-overlay{opacity:1;visibility:visible;}
    </style>
</head>
<body x-data x-init="$store.app.init()">
<!-- Preloader -->
<div class="preloader" x-show="!$store.app.initialized" x-cloak>
    <img src="/marketpro/images/icon/preloader.gif" alt="">
</div>
<div class="overlay"></div>
<div class="progress-wrap">
    <svg class="progress-circle svg-content" width="100%" height="100%" viewBox="-1 -1 102 102">
        <path d="M50,1 a49,49 0 0,1 0,98 a49,49 0 0,1 0,-98" />
    </svg>
</div>
<div class="mobile-menu scroll-sm" :class="$store.app.mobileOpen ? 'active' : ''" x-cloak>
    <button type="button" class="close-button" @click="$store.app.mobileOpen=false"><i class="ph ph-x"></i></button>
    <div class="mobile-menu__inner">
        <a href="/" class="mobile-menu__logo d-block mb-16">
            <span class="text-xl fw-bold text-main-600" x-text="$store.app.siteName()"></span>
        </a>
        <div class="mobile-menu__menu">
            <ul class="nav-menu">
                <li class="nav-menu__item"><a href="/" class="nav-menu__link">首页</a></li>
                <li class="nav-menu__item"><a href="/shops.html" class="nav-menu__link">全部商家</a></li>
                <li class="nav-menu__item"><a href="/account.html" class="nav-menu__link">我的账户</a></li>
            </ul>
        </div>
    </div>
</div>
<div class="header-top bg-main-600 flex-between">
    <div class="container container-lg">
        <div class="flex-between flex-wrap gap-8">
            <div class="d-flex align-items-center gap-10">
                <span class="text-md fw-medium text-white" x-text="$store.app.settings.announcement || '欢迎光临，自动发货 · 7×24小时服务'"></span>
            </div>
            <ul class="header-top__right flex-align flex-wrap gap-16 w-auto">
                <template x-if="!$store.app.user">
                    <li class="d-flex align-items-center gap-12">
                        <a href="/auth/login" class="text-white text-sm">登录</a>
                        <span class="text-white text-sm opacity-50">|</span>
                        <a href="/become-seller.html" class="text-white text-sm">申请开店</a>
                    </li>
                </template>
                <template x-if="$store.app.user">
                    <li class="d-flex align-items-center gap-12">
                        <span class="text-white text-sm">欢迎，<span x-text="$store.app.user.username" class="fw-bold"></span></span>
                        <a href="/account.html" class="text-white text-sm">我的账户</a>
                        <a href="#" @click.prevent="$store.app.logout()" class="text-white text-sm">退出</a>
                    </li>
                </template>
            </ul>
        </div>
    </div>
</div>
<header class="header-middle bg-color-one border-bottom border-gray-100">
    <div class="container container-lg">
        <nav class="header-inner flex-between gap-8">
            <div class="logo flex-shrink-0">
                <a href="/" class="link d-flex align-items-center">
                    <template x-if="$store.app.siteLogoUrl()">
                        <img :src="$store.app.siteLogoUrl()" alt="Logo" style="max-height:44px;">
                    </template>
                    <template x-if="!$store.app.siteLogoUrl()">
                        <span class="text-xl fw-bold text-main-600" x-text="$store.app.siteName()">发卡平台</span>
                    </template>
                </a>
            </div>
            <div class="header-right flex-align gap-16 flex-shrink-0">
                <a href="/account.html" class="flex-align gap-6 item-hover text-gray-700" style="text-decoration:none;font-size:14px;">
                    <span class="text-2xl d-flex item-hover__text"><i class="ph ph-user"></i></span>
                </a>
            </div>
        </nav>
    </div>
</header>
<header class="header bg-white py-10">
    <div class="container container-lg">
        <nav class="header-inner d-flex justify-content-between gap-8">
            <div class="flex-align">
                <a href="/" class="text-xl fw-bold text-main-600" style="text-decoration:none;" x-text="$store.app.siteName()"></a>
            </div>
            <button type="button" class="toggle-mobileMenu d-lg-none" @click="$store.app.mobileOpen=true" style="background:transparent;border:0;font-size:28px;color:#333;"><i class="ph ph-list"></i></button>
        </nav>
    </div>
</header>

  <div class="min-h-screen flex items-center justify-center bg-color-two" style="min-height:60vh;">
    <div class="text-center py-60 px-24">
      <h1 class="fw-bold text-main-600 mb-16" style="font-size:8rem;line-height:1">404</h1>
      <h4 class="fw-bold mb-12">页面不存在</h4>
      <p class="text-gray-500 mb-32">您访问的页面不存在或已被删除</p>
      <a href="/" class="btn btn-main rounded-pill py-12 px-40">返回首页</a>
    </div>
  </div>
<!-- Footer -->
<footer class="footer py-120">
    <div class="container container-lg">
        <div class="footer-item-wrapper d-flex align-items-start flex-wrap">
            <div class="footer-item">
                <div class="footer-item__logo">
                    <a href="/"><span class="text-2xl fw-bold text-main-600" x-text="$store.app.siteName()"></span></a>
                </div>
                <p class="mb-28 text-heading mt-12" x-text="$store.app.settings.site_description || '正版软件 · 游戏充值 · 卡密发货平台'"></p>
            </div>
            <div class="footer-item">
                <h6 class="footer-item__title">快速导航</h6>
                <ul class="footer-menu">
                    <li class="mb-16"><a href="/" class="text-heading hover-text-main-600">首页</a></li>
                    <li class="mb-16"><a href="/shops.html" class="text-heading hover-text-main-600">全部商家</a></li>
                    <li class="mb-16"><a href="/account.html" class="text-heading hover-text-main-600">我的账户</a></li>
                </ul>
            </div>
        </div>
    </div>
</footer>
<div class="bottom-footer py-8">
    <div class="container container-lg">
        <div class="bottom-footer__inner flex-between flex-wrap gap-16 py-16 border-top border-neutral-50">
            <p class="bottom-footer__text text-heading fw-medium">
                <span x-text="$store.app.siteName()"></span> &copy;
                <span class="text-success-600 fw-semibold" x-text="new Date().getFullYear()"></span> 版权所有
            </p>
        </div>
    </div>
</div>
<script src="/marketpro/dist-js/app.bundle.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="/js/site.js"></script>
</body>
</html>
