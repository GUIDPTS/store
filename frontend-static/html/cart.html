<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>购物车</title>
  <link rel="stylesheet" href="/marketpro/css/app.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-utilities.min.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
  <link rel="shortcut icon" href="/marketpro/images/logo/favicon.png">
  <script>
    window.tailwind = { config: {
      corePlugins: { preflight: false },
      theme: { extend: {
        colors: {
          main: { DEFAULT:'#299e60', 50:'#e7f9ef', 100:'#cef2df', 600:'#299e60', 700:'#258e56', 800:'#207e4c' },
          danger: { 50:'#FEF2F2', 600:'#DC2626', 700:'#B91C1C' },
          warning: { 50:'#FEFCE8', 600:'#FF9F29' },
          success: { 600:'#27AE60' },
          'color-one':'#F3FAF2', 'color-three':'#F1F1F1',
        }
      }}
    }};
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    [x-cloak]{display:none!important;}
    .pt-80{padding-top:48px;} .pb-80{padding-bottom:48px;} .py-80{padding-top:48px;padding-bottom:48px;}
    .py-120{padding-top:64px;padding-bottom:48px;} .py-26{padding-top:26px;padding-bottom:26px;}
    .header{padding:8px 0;box-shadow:0 4px 20px rgba(0,0,0,.08)!important;}
    .header-middle{padding:18px 0;}
    .nav-menu__link{font-size:14px!important;font-weight:500;color:#333;padding:12px 16px;line-height:1.4;white-space:nowrap;}
    .nav-menu__link:hover{color:#299e60;}
    .nav-menu{list-style:none;padding:0;margin:0;}
    .common-input:focus{box-shadow:none!important;outline:none!important;}
    .on-hover-dropdown{transition:opacity .2s ease,visibility .2s ease,margin-top .2s ease!important;}
    .footer h6,.footer-item__title{font-family:Quicksand,sans-serif!important;font-size:1.125rem!important;font-weight:700!important;color:#121535!important;margin-bottom:20px!important;line-height:1.3!important;}
    .footer-menu{list-style:none;padding:0;margin:0;}
    .preloader{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;align-items:center;justify-content:center;}
    .overlay{position:fixed;inset:0;background:rgba(18,21,53,.6);opacity:0;visibility:hidden;transition:.2s;z-index:80;}
    .search-box{position:fixed;inset:0;background:rgba(18,21,53,.92);display:none;align-items:center;justify-content:center;z-index:9000;}
    .search-box.active{display:flex;}
    .progress-wrap{position:fixed;right:24px;bottom:24px;width:46px;height:46px;border-radius:50%;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.12);cursor:pointer;opacity:0;visibility:hidden;z-index:90;}
    .table.style-three th{padding:16px 12px;font-size:14px;border-bottom:2px solid #e5e7eb;white-space:nowrap;}
    .table.style-three td{padding:20px 12px;border-bottom:1px solid #f3f4f6;vertical-align:middle;}
    .table.style-three tr:last-child td{border-bottom:none;}
    .table-product__thumb{width:80px;height:80px;min-width:80px;background:#f9fafb;}
    .table-product__thumb img{width:100%;height:100%;object-fit:contain;padding:4px;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .spin{animation:spin 1s linear infinite;}
  </style>
</head>
<body x-data="cartPage()" x-init="init()">

<!-- Preloader -->
<div class="preloader" x-show="!$store.app.initialized" x-cloak>
  <img src="/marketpro/images/icon/preloader.gif" alt="">
</div>

<!-- Toast -->
<div style="position:fixed;top:20px;right:20px;z-index:9999;" x-cloak>
  <template x-if="$store.app.toast">
    <div class="px-16 py-12 rounded-8 text-white text-sm"
         :class="$store.app.toastType === 'error' ? 'bg-danger-600' : 'bg-main-600'"
         x-text="$store.app.toast"></div>
  </template>
</div>

<div class="overlay"></div>
<div class="progress-wrap">
  <svg class="progress-circle svg-content" width="100%" height="100%" viewBox="-1 -1 102 102">
    <path d="M50,1 a49,49 0 0,1 0,98 a49,49 0 0,1 0,-98" />
  </svg>
</div>

<!-- Search Box -->
<form action="#" class="search-box">
  <button type="button" class="search-box__close position-absolute inset-block-start-0 inset-inline-end-0 m-16 w-48 h-48 border border-gray-100 rounded-circle flex-center text-white hover-text-gray-800 hover-bg-white text-2xl transition-1">
    <i class="ph ph-x"></i>
  </button>
  <div class="container">
    <div class="position-relative">
      <input type="text" class="form-control py-16 px-24 text-xl rounded-pill pe-64" placeholder="搜索商品或商家">
      <button type="submit" class="w-48 h-48 bg-main-600 rounded-circle flex-center text-xl text-white position-absolute top-50 translate-middle-y inset-inline-end-0 me-8">
        <i class="ph ph-magnifying-glass"></i>
      </button>
    </div>
  </div>
</form>

<!-- Mobile Menu -->
<div class="mobile-menu scroll-sm" :class="$store.app.mobileOpen ? 'active' : ''" x-cloak>
  <button type="button" class="close-button" @click="$store.app.mobileOpen=false"><i class="ph ph-x"></i></button>
  <div class="mobile-menu__inner">
    <a href="/" class="mobile-menu__logo d-block mb-16">
      <span class="text-xl fw-bold text-main-600" x-text="$store.app.siteName()"></span>
    </a>
    <div class="mobile-menu__menu">
      <ul class="nav-menu">
        <li class="nav-menu__item"><a href="/" class="nav-menu__link">首页</a></li>
        <li class="nav-menu__item"><a href="/shops.html" class="nav-menu__link">全部商家</a></li>
        <template x-for="cat in $store.app.categories" :key="cat.id">
          <li class="nav-menu__item"><a :href="'/category.html?id=' + cat.id" class="nav-menu__link" x-text="cat.name"></a></li>
        </template>
        <li class="nav-menu__item"><a href="/account.html" class="nav-menu__link">我的账户</a></li>
        <li class="nav-menu__item"><a href="/cart.html" class="nav-menu__link">购物车</a></li>
      </ul>
    </div>
  </div>
</div>

<!-- Header Top -->
<div class="header-top bg-main-600 flex-between">
  <div class="container container-lg">
    <div class="flex-between flex-wrap gap-8">
      <span class="text-md fw-medium text-white" x-text="$store.app.settings.announcement || '欢迎光临，自动发货 · 7×24小时服务'"></span>
      <ul class="header-top__right flex-align flex-wrap gap-16 w-auto">
        <template x-if="!$store.app.user">
          <li class="d-flex align-items-center gap-12">
            <a href="/auth/login" class="text-white text-sm hover-text-decoration-underline">登录</a>
            <span class="text-white text-sm opacity-50">|</span>
            <a href="/become-seller.html" class="text-white text-sm hover-text-decoration-underline">申请开店</a>
          </li>
        </template>
        <template x-if="$store.app.user">
          <li class="d-flex align-items-center gap-12">
            <span class="text-white text-sm">欢迎，<span x-text="$store.app.user.username" class="fw-bold"></span></span>
            <a href="/account.html" class="text-white text-sm hover-text-decoration-underline">我的账户</a>
            <a href="#" @click.prevent="$store.app.logout()" class="text-white text-sm hover-text-decoration-underline">退出</a>
          </li>
        </template>
      </ul>
    </div>
  </div>
</div>

<!-- Middle Header -->
<header class="header-middle bg-color-one border-bottom border-gray-100">
  <div class="container container-lg">
    <nav class="header-inner flex-between gap-8">
      <div class="logo flex-shrink-0">
        <a href="/" class="link d-flex align-items-center">
          <template x-if="$store.app.siteLogoUrl()">
            <img :src="$store.app.siteLogoUrl()" alt="Logo" style="max-height:44px;">
          </template>
          <template x-if="!$store.app.siteLogoUrl()">
            <span class="text-xl fw-bold text-main-600" x-text="$store.app.siteName()">发卡平台</span>
          </template>
        </a>
      </div>
      <div class="header-right flex-align gap-16 flex-shrink-0">
        <template x-if="$store.app.user">
          <a href="/account.html" class="flex-align gap-6 item-hover text-gray-700 hover-text-main-600" style="text-decoration:none;font-size:14px;">
            <span class="text-2xl d-flex item-hover__text"><i class="ph ph-user"></i></span>
            <span class="d-none d-xl-flex item-hover__text" x-text="$store.app.user.username || '我的账户'"></span>
          </a>
        </template>
        <template x-if="!$store.app.user">
          <a href="/auth/login" class="flex-align gap-6 item-hover text-gray-700" style="text-decoration:none;font-size:14px;">
            <span class="text-2xl d-flex item-hover__text"><i class="ph ph-user"></i></span>
            <span class="d-none d-xl-flex item-hover__text">登录 / 注册</span>
          </a>
        </template>
        <a href="/account.html#orders" class="flex-align gap-6 item-hover text-gray-700" style="text-decoration:none;font-size:14px;">
          <span class="text-2xl d-flex me-4 item-hover__text"><i class="ph ph-receipt"></i></span>
          <span class="d-none d-xl-flex item-hover__text">我的订单</span>
        </a>
        <!-- Cart icon (active/highlighted) -->
        <a href="/cart.html" class="flex-align gap-6 item-hover text-main-600 position-relative" style="text-decoration:none;font-size:14px;">
          <span class="text-2xl d-flex item-hover__text"><i class="ph ph-shopping-cart"></i></span>
          <template x-if="$store.cart && $store.cart.count() > 0">
            <span class="position-absolute bg-main-600 text-white rounded-circle d-flex align-items-center justify-content-center"
                  style="min-width:18px;height:18px;font-size:10px;top:-6px;right:-6px;padding:0 3px;"
                  x-text="$store.cart.count()"></span>
          </template>
          <span class="d-none d-xl-flex item-hover__text fw-semibold">购物车</span>
        </a>
        <button type="button" class="toggle-mobileMenu d-lg-none" @click="$store.app.mobileOpen=true" style="background:transparent;border:0;font-size:28px;color:#333;"><i class="ph ph-list"></i></button>
      </div>
    </nav>
  </div>
</header>

<!-- Sticky Nav Header -->
<header class="header bg-white py-10">
  <div class="container container-lg">
    <nav class="header-inner d-flex justify-content-between gap-8">
      <div class="flex-align menu-category-wrapper">
        <div class="header-menu d-lg-block d-none">
          <ul class="nav-menu flex-align">
            <li class="nav-menu__item"><a href="/" class="nav-menu__link">首页</a></li>
            <li class="on-hover-item nav-menu__item has-submenu">
              <a href="/shops.html" class="nav-menu__link">全部商家</a>
              <ul class="on-hover-dropdown common-dropdown nav-submenu" style="min-width:160px;">
                <li class="common-dropdown__item"><a href="/shops.html" class="common-dropdown__link">商家列表</a></li>
                <li class="common-dropdown__item"><a href="/become-seller.html" class="common-dropdown__link">申请开店</a></li>
              </ul>
            </li>
            <li class="on-hover-item nav-menu__item has-submenu">
              <a href="javascript:void(0)" class="nav-menu__link">商品分类</a>
              <ul class="on-hover-dropdown common-dropdown nav-submenu scroll-sm" style="min-width:180px;max-height:320px;overflow-y:auto;">
                <template x-for="cat in $store.app.categories" :key="cat.id">
                  <li class="common-dropdown__item">
                    <a :href="'/category.html?id=' + cat.id" class="common-dropdown__link" x-text="cat.name"></a>
                  </li>
                </template>
              </ul>
            </li>
            <li class="nav-menu__item"><a href="/account.html" class="nav-menu__link">我的账户</a></li>
            <li class="nav-menu__item"><a href="/cart.html" class="nav-menu__link text-main-600">购物车</a></li>
          </ul>
        </div>
      </div>
      <div class="header-right flex-align gap-20">
        <template x-if="$store.app.settings.contact_qq">
          <a href="javascript:void(0)" class="d-sm-flex align-items-center gap-16 d-none">
            <span>
              <span class="d-block text-heading fw-medium">客服 QQ</span>
              <span class="d-block fw-bold text-main-600" x-text="$store.app.settings.contact_qq"></span>
            </span>
          </a>
        </template>
        <button type="button" class="toggle-mobileMenu d-lg-none" @click="$store.app.mobileOpen=true" style="background:transparent;border:0;font-size:28px;color:#333;"><i class="ph ph-list"></i></button>
      </div>
    </nav>
  </div>
</header>

<!-- Breadcrumb -->
<div class="breadcrumb mb-0 py-26" style="background:#f5f5f5;">
  <div class="container container-lg">
    <div class="breadcrumb-wrapper flex-between flex-wrap gap-16">
      <h6 class="mb-0">
        购物车
        <template x-if="$store.cart && $store.cart.count() > 0">
          <span class="fw-normal text-gray-400 text-base ms-8">（<span x-text="$store.cart.count()"></span> 件）</span>
        </template>
      </h6>
      <ul class="flex items-center gap-8 flex-wrap list-unstyled mb-0">
        <li class="text-sm"><a href="/" class="text-gray-900 flex items-center gap-8 hover-text-main-600"><i class="ph ph-house"></i> 首页</a></li>
        <li class="flex items-center"><i class="ph ph-caret-right"></i></li>
        <li class="text-sm text-main-600">购物车</li>
      </ul>
    </div>
  </div>
</div>

<!-- ===== Cart Section ===== -->
<section class="cart py-80">
  <div class="container container-lg">

    <!-- Empty cart -->
    <template x-if="$store.cart && $store.cart.items.length === 0">
      <div class="text-center py-80">
        <i class="ph ph-shopping-cart-simple d-block mb-16 text-gray-200" style="font-size:5rem;"></i>
        <h5 class="mb-8 text-gray-500">购物车是空的</h5>
        <p class="text-gray-400 mb-24">快去挑选你喜欢的商品吧～</p>
        <a href="/" class="btn btn-main rounded-pill py-12 px-40">去购物</a>
      </div>
    </template>

    <!-- Cart items -->
    <template x-if="$store.cart && $store.cart.items.length > 0">
      <div class="row g-4">
        <!-- Left: Cart Table -->
        <div class="col-2xl-9 col-xl-8">
          <div class="cart-table border border-gray-100 rounded-8 px-40 py-48">
            <div class="overflow-x-auto scroll-sm scroll-sm-horizontal">
              <table class="table style-three" style="min-width:560px;">
                <thead>
                  <tr>
                    <th class="h6 mb-0 fw-bold" style="width:48px;">删除</th>
                    <th class="h6 mb-0 fw-bold">商品</th>
                    <th class="h6 mb-0 fw-bold">单价</th>
                    <th class="h6 mb-0 fw-bold" style="width:160px;">数量</th>
                    <th class="h6 mb-0 fw-bold">小计</th>
                    <th class="h6 mb-0 fw-bold" style="width:100px;"></th>
                  </tr>
                </thead>
                <tbody>
                  <template x-for="(item, idx) in $store.cart.items" :key="item.id">
                    <tr>
                      <!-- Remove -->
                      <td>
                        <button type="button" @click="$store.cart.remove(item.id)"
                                class="d-flex align-items-center gap-6 text-gray-400 hover-text-danger-600"
                                style="background:none;border:0;cursor:pointer;font-size:13px;padding:0;">
                          <i class="ph ph-x-circle text-2xl d-flex"></i>
                        </button>
                      </td>
                      <!-- Product -->
                      <td>
                        <div class="table-product d-flex align-items-center gap-16">
                          <a :href="'/product.html?id=' + item.id"
                             class="table-product__thumb border border-gray-100 rounded-8 d-flex align-items-center justify-content-center flex-shrink-0 overflow-hidden"
                             style="width:72px;height:72px;background:#f9fafb;">
                            <template x-if="item.image">
                              <img :src="item.image" :alt="item.name" style="width:100%;height:100%;object-fit:contain;padding:4px;">
                            </template>
                            <template x-if="!item.image">
                              <i class="ph ph-package text-gray-300 text-3xl"></i>
                            </template>
                          </a>
                          <div class="table-product__content">
                            <h6 class="fw-semibold mb-4" style="font-size:14px;line-height:1.4;">
                              <a :href="'/product.html?id=' + item.id" class="link text-gray-900 hover-text-main-600" x-text="item.name"></a>
                            </h6>
                            <span class="text-xs text-gray-400" x-text="'库存：' + (item.stock || '—')"></span>
                          </div>
                        </div>
                      </td>
                      <!-- Price -->
                      <td>
                        <span class="fw-semibold text-gray-900" x-text="'¥' + Number(item.price).toFixed(2)"></span>
                      </td>
                      <!-- Qty -->
                      <td>
                        <div class="d-flex rounded-4 overflow-hidden border border-gray-100" style="width:130px;">
                          <button type="button"
                                  @click="$store.cart.updateQty(item.id, item.qty - 1)"
                                  class="d-flex align-items-center justify-content-center text-gray-600 hover-bg-main-600 hover-text-white flex-shrink-0 border-0"
                                  style="width:40px;height:40px;background:transparent;cursor:pointer;">
                            <i class="ph ph-minus"></i>
                          </button>
                          <input type="number"
                                 :value="item.qty"
                                 @change="$store.cart.updateQty(item.id, $event.target.value)"
                                 min="1" :max="item.stock"
                                 class="border-0 text-center flex-grow-1 border-start border-end border-gray-100"
                                 style="width:40px;font-size:14px;outline:none;">
                          <button type="button"
                                  @click="$store.cart.updateQty(item.id, item.qty + 1)"
                                  class="d-flex align-items-center justify-content-center text-gray-600 hover-bg-main-600 hover-text-white flex-shrink-0 border-0"
                                  style="width:40px;height:40px;background:transparent;cursor:pointer;">
                            <i class="ph ph-plus"></i>
                          </button>
                        </div>
                      </td>
                      <!-- Subtotal -->
                      <td>
                        <span class="fw-bold text-main-600" x-text="'¥' + (item.price * item.qty).toFixed(2)"></span>
                      </td>
                      <!-- Action -->
                      <td>
                        <a :href="'/checkout.html?id=' + item.id + '&qty=' + item.qty"
                           class="btn btn-main py-8 px-16 rounded-8 text-sm">
                          结算
                        </a>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
            <!-- Cart actions -->
            <div class="d-flex align-items-center justify-content-between flex-wrap gap-16 mt-24 pt-16 border-top border-gray-100">
              <a href="/" class="d-flex align-items-center gap-8 text-gray-500 hover-text-main-600 text-sm" style="text-decoration:none;">
                <i class="ph ph-arrow-left"></i>继续购物
              </a>
              <button type="button" @click="confirmClear()"
                      class="d-flex align-items-center gap-8 text-gray-400 hover-text-danger-600 text-sm"
                      style="background:none;border:0;cursor:pointer;">
                <i class="ph ph-trash"></i>清空购物车
              </button>
            </div>
          </div>
        </div>

        <!-- Right: Cart Summary Sidebar -->
        <div class="col-2xl-3 col-xl-4">
          <div class="cart-sidebar border border-gray-100 rounded-8 px-24 py-40">
            <h6 class="text-xl mb-32 fw-bold">订单汇总</h6>

            <div class="bg-color-three rounded-8 p-24 mb-0">
              <div class="mb-20 d-flex justify-content-between gap-8">
                <span class="text-gray-700">商品数</span>
                <span class="fw-semibold text-gray-900" x-text="$store.cart.count() + ' 件'"></span>
              </div>
              <div class="mb-20 d-flex justify-content-between gap-8">
                <span class="text-gray-700">商品种类</span>
                <span class="fw-semibold text-gray-900" x-text="$store.cart.items.length + ' 种'"></span>
              </div>
              <div class="d-flex justify-content-between gap-8">
                <span class="text-gray-900 fw-bold text-xl">合计</span>
                <span class="text-main-600 fw-bold text-xl" x-text="'¥' + Number($store.cart.total()).toFixed(2)"></span>
              </div>
            </div>

            <!-- Multi-item notice -->
            <template x-if="$store.cart.items.length > 1">
              <div class="mt-16 p-12 bg-main-50 border border-main-100 rounded-8 d-flex gap-8 align-items-start">
                <i class="ph ph-info text-main-600 flex-shrink-0 mt-1"></i>
                <span class="text-sm text-main-700">购物车含多件商品，请点击各商品行的"结算"按钮逐一下单，或点击下方前往结算选择首件商品。</span>
              </div>
            </template>

            <!-- Checkout button -->
            <button type="button" @click="goCheckout()"
                    class="btn btn-main mt-24 py-18 w-100 rounded-8 d-flex align-items-center justify-content-center gap-8">
              <i class="ph ph-lightning"></i>
              前往结算
            </button>

            <!-- Continue shopping -->
            <a href="/" class="d-block text-center text-gray-500 text-sm mt-16 hover-text-main-600">
              <i class="ph ph-arrow-left me-4"></i>继续购物
            </a>
          </div>
        </div>
      </div>
    </template>
  </div>
</section>

<!-- Clear Cart Confirm Modal -->
<template x-if="showClearConfirm">
<div class="fixed inset-0 z-[9998]" style="background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;">
  <div class="bg-white rounded-16 p-32 text-center" style="max-width:360px;width:90%;margin:0 16px;">
    <i class="ph ph-warning d-block mb-16 text-warning-600" style="font-size:3rem;"></i>
    <h6 class="mb-8">确认清空购物车？</h6>
    <p class="text-gray-500 text-sm mb-24">此操作将移除购物车中的所有商品。</p>
    <div class="d-flex gap-12">
      <button type="button" @click="showClearConfirm=false"
              class="btn btn-outline-main rounded-pill py-10 flex-grow-1">取消</button>
      <button type="button" @click="$store.cart.clear(); showClearConfirm=false"
              class="btn btn-danger rounded-pill py-10 flex-grow-1" style="background:#DC2626;border-color:#DC2626;color:#fff;">确认清空</button>
    </div>
  </div>
</div>

<script>
  function cartPage() {
    return {
      showClearConfirm: false,

      async init() {
        await new Promise(resolve => {
          const check = () => { if (this.$store.app.initialized) return resolve(); setTimeout(check, 50); };
          check();
        });
      },

      confirmClear() {
        if (this.$store.cart.items.length === 0) return;
        this.showClearConfirm = true;
      },

      goCheckout() {
        const items = this.$store.cart.items;
        if (items.length === 0) return;
        if (!this.$store.app.user) {
          window.location.href = '/auth/login?redirect=/cart.html';
          return;
        }
        // Single item → go directly to checkout
        if (items.length === 1) {
          window.location.href = '/checkout.html?id=' + items[0].id + '&qty=' + items[0].qty;
          return;
        }
        // Multiple items → go to checkout with first item, show hint
        window.location.href = '/checkout.html?id=' + items[0].id + '&qty=' + items[0].qty + '&fromcart=1';
      },
    };
  }
</script>
